trigger: none

pool: Docker-VM_Pool

stages:
  - stage: TerrafromInitAndValidate
    displayName: Terraform_Init
    jobs: 
    - job: InitAndValidate
      displayName: InitAndValidate
      steps:
      - task: TerraformInstaller@1
        inputs:
          terraformVersion: 'latest'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'Axion-Service-Connection'
          backendAzureRmResourceGroupName: 'Backend_RG'
          backendAzureRmStorageAccountName: 'axionstatestorage'
          backendAzureRmContainerName: 'axioncontainer'
          backendAzureRmKey: 'terraform.tfstate'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'validate'
  - stage: Scanning
    displayName: Terraform_Code_Scanning
    dependsOn: TerrafromInitAndValidate
    condition: succeeded()
    jobs:
    - job: Code_Scanning
      displayName: Code_Scanning
      steps:
      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
            
            tfsec .
          workingDirectory: '$(System.DefaultWorkingDirectory)/AKS_Cluster_Infra'
      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            curl -sSLO https://github.com/terraform-linters/tflint/releases/latest/download/tflint_linux_amd64.zip
            curl -sSLO https://github.com/terraform-linters/tflint/releases/latest/download/checksums.txt
            gh attestation verify checksums.txt -R terraform-linters/tflint
            sha256sum --ignore-missing -c checksums.txt
            unzip tflint_linux_amd64.zip
            sudo install -c -v tflint /usr/local/bin/
            tflint --init
            tflint
          workingDirectory: '$(System.DefaultWorkingDirectory)/AKS_Cluster_Infra'



      

      
        
      
