trigger: none

pool: Docker-VM_Pool

stages:
  - stage: TerrafromInitAndValidate
    displayName: Terraform_Init
    jobs: 
    - job: InitAndValidate
      displayName: InitAndValidate
      steps:
      - task: TerraformInstaller@1
        inputs:
          terraformVersion: 'latest'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'Axion-Service-Connection'
          backendAzureRmResourceGroupName: 'Backend_RG'
          backendAzureRmStorageAccountName: 'axionstatestorage'
          backendAzureRmContainerName: 'axioncontainer'
          backendAzureRmKey: 'terraform.tfstate'
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'validate'
  - stage: Scanning
    displayName: Terraform_Code_Scanning
    dependsOn: TerrafromInitAndValidate
    condition: succeeded()
    jobs:
    - job: Code_Scanning
      displayName: Code_Scanning
      continueOnError: true
      steps:
      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
            
            tfsec .
          workingDirectory: '$(System.DefaultWorkingDirectory)'
        displayName: 'Run tflint'

      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            cd $(System.DefaultWorkingDirectory)
            tflint --init
            tflint --recursive -f default
        displayName: 'Run tfsec'
        continueOnError: true
      - task: Bash@3
        displayName: 'Run Checkov'
        inputs:
          targetType: 'inline'
          script: |
            export PATH="/home/Brijendra/.local/bin:$PATH"

            echo "PATH=$PATH"
            which checkov
            checkov --version

            checkov -d "$(System.DefaultWorkingDirectory)" --framework terraform
          workingDirectory: '$(System.DefaultWorkingDirectory)'
        continueOnError: true
      
      - task: Bash@3
        inputs:
          targetType: 'inline'
          script: |
            curl -s https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_arm64.tar.gz | bash
            tar -xvf gitleaks_8.30.1_linux_arm64.tar.gz
            sudo mv gitleaks /home/Brijendra/.local/bin/gitleaks
            sudo chmod +x /home/Brijendra/.local/bin/gitleaks
            gitleaks 
            dir: '$(System.DefaultWorkingDirectory)'




      

      
        
      
